[project]
name = "govnotify_agent"
version = "0.1.0"
description = "govnotify_agent using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "chromadb>=1.1.1",
    "crewai[groq,tools]>=1.15.17,<2.0.0",
    "litellm>=1.80.0",
    "python-dotenv>=1.2.3",
    "stagehand==0.5.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agents", "crew.jsonc", "tools", "knowledge", "skills"]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
project_id = "cc1185c3-7e8c-4404-a01d-3c7bdc20b6d6"
